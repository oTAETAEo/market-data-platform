plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.compose'
    id 'org.openjfx.javafxplugin'
}

javafx {
    version = '21.0.10'
    modules = ['javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.web', 'javafx.swing']
}

dependencies {
    implementation project(':modules:core-domain')
    implementation project(':modules:collector-binance')
    implementation project(':modules:collector-bybit')
    implementation project(':modules:market-engine')
    implementation project(':modules:ai-adapter')
    implementation project(':modules:local-storage')

    implementation compose.desktop.currentOs
    implementation 'com.halilibo.compose-richtext:richtext-commonmark:0.17.0'
    implementation 'com.halilibo.compose-richtext:richtext-ui-material:0.17.0'
}

def javafxModuleFiles = files(providers.provider {
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { it.moduleVersion.id.group == 'org.openjfx' }
            .collect { it.file }
})
def javafxResources = layout.buildDirectory.dir('javafx-resources')
def prepareJavafxModules = tasks.register('prepareJavafxModules', Sync) {
    from javafxModuleFiles
    into javafxResources.map { it.dir('common/javafx') }
}

tasks.withType(JavaExec).configureEach {
    dependsOn prepareJavafxModules
    jvmArgumentProviders.add({
        ['--module-path', javafxModuleFiles.asPath, '--add-modules=javafx.swing,javafx.web']
    } as CommandLineArgumentProvider)
    doFirst {
        classpath = classpath.minus(javafxModuleFiles)
        jvmArgs = jvmArgs.findAll { !it.startsWith('--module-path=') }
    }
}

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add({
        ['--module-path', javafxModuleFiles.asPath, '--add-modules=javafx.swing,javafx.web']
    } as CommandLineArgumentProvider)
    doFirst { classpath = classpath.minus(javafxModuleFiles) }
}

compose.desktop {
    application {
        mainClass = 'com.marketdata.desktop.MainKt'
        disableDefaultConfiguration()
        fromFiles(configurations.runtimeClasspath.minus(javafxModuleFiles))
        fromFiles(tasks.named('jar', Jar).flatMap { it.archiveFile })
        mainJar.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
        dependsOn('jar', 'prepareJavafxModules')
        jvmArgs('--module-path=$APPDIR/resources/javafx', '--add-modules=javafx.swing,javafx.web')

        nativeDistributions {
            appResourcesRootDir.set(prepareJavafxModules.map { javafxResources.get() })
            modules('java.logging', 'java.net.http', 'java.xml', 'java.prefs', 'jdk.crypto.ec',
                    'jdk.jsobject', 'jdk.xml.dom', 'jdk.unsupported', 'jdk.unsupported.desktop')
            packageName = 'MarketDataPlatform'
            packageVersion = '0.1.0'

            macOS {
                // JDK 21 jpackage requires a positive leading number for macOS app images.
                packageVersion = '1.0.0'
                bundleID = 'com.marketdata.desktop'
            }
        }
    }
}

tasks.register('verifyWorkspace', JavaExec) {
    group = 'verification'
    description = 'Checks desktop selection, session history and asynchronous analysis state.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.WorkspaceViewModelChecksKt'
}

tasks.named('check') {
    dependsOn 'verifyWorkspace', 'verifyDesktopUi', 'verifyAppearance', 'verifyMarketSearch'
}

tasks.register('verifyMarketSearch', JavaExec) {
    group = 'verification'
    description = 'Checks market search autocomplete focus, selection, dismissal and both themes.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.MarketSearchChecksKt'
    systemProperty 'java.awt.headless', 'true'
    args layout.buildDirectory.dir('reports/market-search').get().asFile.absolutePath
}

tasks.register('verifyAppearance', JavaExec) {
    group = 'verification'
    description = 'Checks persisted appearance preferences and theme text contrast.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.AppearancePreferencesChecksKt'
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('test') {
    // Standalone checks and their Compose-generated helpers run through JavaExec, not JUnit.
    exclude 'com/marketdata/desktop/*ChecksKt*.class'
    exclude 'com/marketdata/desktop/*SmokeKt*.class'
}

tasks.register('verifyDesktopUi', JavaExec) {
    group = 'verification'
    description = 'Renders desktop layouts and checks Compose UI actions without screen permissions.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.DesktopUiChecksKt'
    systemProperty 'java.awt.headless', 'true'
    args layout.buildDirectory.dir('reports/desktop-ui').get().asFile.absolutePath
}

tasks.register('verifyDesktopWindow', JavaExec) {
    group = 'verification'
    description = 'Checks native desktop window configuration with an undisplayed window.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.DesktopWindowChecksKt'
    systemProperty 'java.awt.headless', 'false'
}

tasks.register('verifyLiveMarket', JavaExec) {
    group = 'verification'
    description = 'Loads public Binance BTCUSDT candles into the in-memory market engine.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.LiveMarketSmokeKt'
}

tasks.register('verifyChartRuntime', JavaExec) {
    group = 'verification'
    description = 'Loads Lightweight Charts in JavaFX WebView and sends one candle.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.LightweightChartSmokeKt'
    systemProperty 'java.awt.headless', 'false'
    args layout.buildDirectory.dir('reports/chart-runtime').get().asFile.absolutePath
}

tasks.register('verifyChartPopup', JavaExec) {
    group = 'verification'
    description = 'Checks dropdown opening frames, short clicks, dismissal and chart visibility.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.ChartPopupSmokeKt'
    systemProperty 'java.awt.headless', 'false'
    args layout.buildDirectory.dir('reports/chart-popup').get().asFile.absolutePath
}

tasks.register('verifyChartRecomposition', JavaExec) {
    group = 'verification'
    description = 'Checks live price updates do not detach the chart during Compose recomposition.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.ChartRecompositionSmokeKt'
    systemProperty 'java.awt.headless', 'false'
}

tasks.register('verifyChartScrolling', JavaExec) {
    group = 'verification'
    description = 'Checks scrolling uses a nonblank Compose frame and restores the live interactive chart.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.marketdata.desktop.ChartScrollingSmokeKt'
    systemProperty 'java.awt.headless', 'false'
}
